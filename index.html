<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moses Ghouri | Personal Website</title>

    <style>
        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #111827;
            padding: 18px 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 14px;
            font-size: 17px;
            font-weight: bold;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
        }

        .hero h1 {
            font-size: 52px;
            margin: 0 0 20px;
        }

        .hero p {
            font-size: 21px;
            margin-bottom: 30px;
        }

        .hero-button {
            display: inline-block;
            padding: 14px 28px;
            background: white;
            color: #2563eb;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .hero-button:hover {
            background: #e5e7eb;
        }

        .section {
            max-width: 800px;
            margin: 40px auto;
            padding: 45px 30px;
            background: white;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            font-size: 34px;
            margin-bottom: 20px;
        }

        .section p {
            font-size: 18px;
            line-height: 1.7;
        }

        .contact-button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .contact-button:hover {
            background: #1d4ed8;
        }

        footer {
            margin-top: 60px;
            padding: 25px;
            background: #111827;
            color: white;
            text-align: center;
        }

        @media (max-width: 600px) {

            nav a {
                margin: 0 7px;
                font-size: 15px;
            }

            .hero {
                min-height: 75vh;
                padding: 50px 15px;
            }

            .hero h1 {
                font-size: 40px;
            }

            .hero p {
                font-size: 18px;
            }

            .section {
                margin: 25px 12px;
                padding: 35px 20px;
            }

            .section h2 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="hero" id="home">
        <h1>Hi, I'm Moses Ghouri</h1>
        <p>Welcome to my personal website.</p>

        <a class="hero-button" href="#about">
            Learn More
        </a>
    </section>

    <section class="section" id="about">
        <h2>About Me</h2>

        <p>
            Hello! My name is Moses Ghouri.
            I'm learning HTML and web development,
            and this is my first personal website.
        </p>
    </section>

    <section class="section" id="contact">
        <h2>Contact Me</h2>

        <p>
            Thanks for visiting my website!
        </p>

        <a class="contact-button" href="mailto:mosesghouri522@gmail.com">
            Contact Me
        </a>
    </section>

    <footer>
        <p>© 2026 Moses Ghouri</p>
    </footer>

</body>

</html>
