<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moses Ghouri | My Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            color: #222;
        }

        nav {
            background: #111827;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
            font-size: 16px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            background: #2563eb;
            color: white;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
        }

        .section {
            max-width: 700px;
            margin: 30px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            text-align: center;
        }

        .section h2 {
            font-size: 30px;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111827;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="hero" id="home">
        <h1>Hi, I'm Moses Ghouri</h1>
        <p>Welcome to my personal website!</p>
    </section>

    <section class="section" id="about">
        <h2>About Me</h2>
        <p>
            Hello! My name is Moses Ghouri.
            I'm learning HTML and web development,
            and this is my first personal website.
        </p>
    </section>

    <section class="section" id="contact">
        <h2>Contact Me</h2>
        <p>Thanks for visiting my website!</p>
        <a class="button" href="mailto:your@email.com">
            Contact Me
        </a>
    </section>

    <footer>
        <p>© 2026 Moses Ghouri</p>
    </footer>

</body>
</html>
